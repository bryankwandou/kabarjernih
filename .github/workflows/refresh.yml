# Pulls the feeds once a day, commits the new data and deploys to Vercel.
# Deploying needs VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repo
# secrets; without them the step is skipped.
name: refresh-news

on:
  schedule:
    # Once every 24 hours (22:07 UTC). This is the only automatic deploy; Vercel
    # itself never deploys (vercel.json turns Git deployments off).
    - cron: "7 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "kabarjernih-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          # GitHub occasionally answers a push with a 500; try again before giving up.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            [ "$i" = 3 ] && exit 1
            sleep 20
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npm run check
          # One archive instead of ~5,000 files: the free plan caps uploads at 5,000 files a day.
          npx vercel@latest deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
