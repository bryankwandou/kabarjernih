# Pulls the feeds every hour, commits the new data and deploys to Vercel.
# Deploying needs VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repo
# secrets; without them the step is skipped.
name: refresh-news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # Code changes deploy too. The bot's own data commits use GITHUB_TOKEN,
  # which never triggers another run, so this cannot loop.
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "kabarjernih-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: refresh feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to Vercel
        # Hourly runs deploy only when the data moved; manual runs and code pushes always deploy.
        if: (steps.commit.outputs.changed == 'true' || github.event_name != 'schedule') && env.VERCEL_TOKEN != ''
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npm run check
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
